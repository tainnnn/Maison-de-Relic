<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="login.pageTitle">เข้าสู่ระบบ · Maison de Relic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <link rel="stylesheet" href="/css/portfolio-demo.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <!-- หน้าบังคับ: Login Page — เข้าสู่ระบบด้วย Username/Password
         ใช้ร่วมกันทั้งแอดมินและลูกค้า: แอดมินไปหน้าจัดการ ลูกค้าที่ยังไม่ยืนยันอีเมลไปหน้า OTP
         ผู้รับผิดชอบ: R2 -->
    <section class="card auth-card">
      <h1 data-i18n="login.title">เข้าสู่ระบบ</h1>
      <p class="portfolio-demo-note">Portfolio demo: select a test account and sign in. Account creation and other non-demo changes are disabled.</p>
      <label class="portfolio-demo-account" for="demo-account">Test account
        <select id="demo-account">
          <option value="customer">Customer — Cart, Checkout, Orders</option>
          <option value="staff">Staff — Admin Orders</option>
        </select>
      </label>
      <div id="login-notice" class="alert alert-success" role="status" hidden></div>
      <form id="login-form" novalidate>
        <div class="alert alert-error" data-form-alert role="alert" hidden></div>
        <div class="field">
          <label for="username" data-i18n="acct.username">ชื่อผู้ใช้</label>
          <input id="username" name="username" autocomplete="username" required maxlength="100">
          <small class="field-error" data-error-for="username"></small>
        </div>
        <div class="field">
          <label for="password" data-i18n="acct.password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="100">
          <small class="field-error" data-error-for="password"></small>
        </div>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">เข้าสู่ระบบ</button>
      </form>
      <div class="auth-links">
        <span>Demo accounts are prefilled. Registration and password reset are disabled.</span>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
